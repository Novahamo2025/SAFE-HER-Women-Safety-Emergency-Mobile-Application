name: safeher
description: "SafeHer: Women Safety & Emergency Mobile Application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Design
  cupertino_icons: ^1.0.6
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0

  # State Management & Network
  provider: ^6.1.2
  dio: ^5.5.0+1
  http: ^1.2.2

  # Location & Maps
  geolocator: ^12.0.0
  google_maps_flutter: ^2.6.1

  # Native Hardware & Tools
  url_launcher: ^6.3.0
  torch_light: ^1.0.0
  audioplayers: ^6.0.0
  vibration: ^2.0.0

  # Storage & Offline Persistence
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3

  # Battery Optimization & Foreground Service
  disable_battery_optimization: ^1.1.0
  flutter_local_notifications: ^17.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
    - assets/images/
