name: SafeHer Backend CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'safeher-backend/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'safeher-backend/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: safeher_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/safeher_test
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      JWT_SECRET: CI_TestSecretKeyThatIsAtLeast256BitsLongForHMACSHA256Algorithm00

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Build backend
        working-directory: safeher-backend
        run: |
          chmod +x mvnw 2>/dev/null || true
          ./mvnw clean compile -B -q

      - name: Run tests
        working-directory: safeher-backend
        run: |
          ./mvnw test -B

      - name: Package application
        working-directory: safeher-backend
        run: |
          ./mvnw package -DskipTests -B -q

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: safeher-backend/target/surefire-reports/
          retention-days: 7
