# Test profile — uses H2 in-memory database, disables Flyway
spring:
  datasource:
    url: jdbc:h2:mem:safeher_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

app:
  jwt:
    secret: TestSecretKeyThatIsAtLeast256BitsLongForHMACSHA256AlgorithmUsage00
    access-token-expiration-ms: 300000
    refresh-token-expiration-ms: 600000
    issuer: safeher-api-test
  sms:
    enabled: false
  firebase:
    enabled: false
  contacts:
    max-per-user: 10

logging:
  level:
    root: WARN
    com.safeher: DEBUG
