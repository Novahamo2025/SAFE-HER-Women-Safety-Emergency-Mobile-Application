# Test profile — uses H2 in-memory database, disables Flyway
spring:
  datasource:
    url: jdbc:h2:mem:safeher_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

app:
  jwt:
    secret: TestSecretKeyThatIsAtLeast256BitsLongForHMACSHA256AlgorithmUsage00
    access-token-expiration-ms: 300000
    refresh-token-expiration-ms: 600000
    issuer: safeher-api-test
  sms:
    enabled: false
  firebase:
    enabled: false
  contacts:
    max-per-user: 10
  outbox:
    enabled: false
    batch-size: 10
    poll-interval-ms: 60000
    recovery-interval-ms: 60000
    lease-duration-seconds: 120
  crypto:
    otp-pepper-key: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    otp-pepper-version: v1
    sms-encryption-key-v1: fedcba9876543210fedcba9876543210fedcba9876543210fedcba9876543210
    sms-encryption-key-version: v1
    validate-on-startup: true
  webhook:
    msg91:
      secret-header-name: X-SvaShield-Webhook-Secret
      secret-header-value: test-webhook-secret-token-abcdef123456
      url-token: test-url-token-xyz789

logging:
  level:
    root: WARN
    com.safeher: DEBUG
