server:
  address: 0.0.0.0
  port: ${PORT:8081}
  shutdown: graceful
  servlet:
    context-path: /

spring:
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: ${SUPABASE_DB_URL:jdbc:postgresql://aws-0-ap-northeast-2.pooler.supabase.com:5432/postgres?sslmode=require}
    username: ${SUPABASE_DB_USERNAME:postgres.pxsizfegyxoqsfgdefvm}
    password: ${SUPABASE_DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
    validate-on-migrate: true

# SafeHer Security and Token Parameters
app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    access-token-expiration-ms: ${JWT_ACCESS_EXPIRY_MS:900000}
    refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRY_MS:604800000}
    issuer: safeher-api

  # SMS Gateway Integration (MSG91 / Indian DLT Provider)
  sms:
    provider: ${SMS_PROVIDER:MSG91}
    auth-key: ${MSG91_AUTH_KEY:mock_auth_key}
    sender-id: ${MSG91_SENDER_ID:SAFHER}
    dlt-template-id: ${MSG91_DLT_TE_ID:1207161234567890123}
    enabled: ${SMS_ENABLED:false}

  # Firebase Admin SDK Configuration
  firebase:
    service-account-path: ${FIREBASE_CREDENTIALS_PATH:firebase-service-account.json}
    enabled: ${FIREBASE_ENABLED:false}

  # Contact limits
  contacts:
    max-per-user: ${MAX_CONTACTS_PER_USER:10}

  # SMS Outbox Dispatcher
  outbox:
    enabled: ${OUTBOX_ENABLED:true}
    batch-size: ${OUTBOX_BATCH_SIZE:10}
    poll-interval-ms: ${OUTBOX_POLL_INTERVAL_MS:5000}
    recovery-interval-ms: ${OUTBOX_RECOVERY_INTERVAL_MS:60000}
    lease-duration-seconds: ${OUTBOX_LEASE_SECONDS:120}

  # OTP & SMS Outbox Cryptographic Services (HMAC-SHA256 Pepper & AES-256-GCM)
  crypto:
    otp-pepper-key: ${OTP_PEPPER_KEY:}
    otp-pepper-version: ${OTP_PEPPER_VERSION:v1}
    sms-encryption-key-v1: ${SMS_ENCRYPTION_KEY_V1:}
    sms-encryption-key-version: ${SMS_ENCRYPTION_KEY_VERSION:v1}
    validate-on-startup: ${CRYPTO_VALIDATE_ON_STARTUP:false}

  # MSG91 SendOTP Webhook Configuration
  webhook:
    msg91:
      secret-header-name: ${MSG91_WEBHOOK_HEADER_NAME:X-SvaShield-Webhook-Secret}
      secret-header-value: ${MSG91_WEBHOOK_SECRET:}
      url-token: ${MSG91_WEBHOOK_URL_TOKEN:}

# Logging configuration
logging:
  level:
    root: INFO
    com.safeher: DEBUG
    org.springframework.security: INFO
    org.flywaydb: INFO
